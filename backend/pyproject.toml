[project]
name = "motiva-voice-agent-backend"
version = "0.1.0"
description = "Backend do agente de voz Motiva (FIAP) — MVP Persona 1"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends(...) em default de argumento é o padrão idiomático do FastAPI.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
